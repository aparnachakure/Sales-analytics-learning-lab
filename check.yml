name: Check project

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  node-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        run: node --check server.js && node --check public/app.js

      - name: Check required project files
        run: |
          test -f data/sales_data_for_excel.csv
          test -f sql/01_create_sales_table.sql
          test -f sql/02_beginner_queries.sql
          test -f sql/03_power_bi_measures.sql
          test -f public/index.html
          test -f public/styles.css